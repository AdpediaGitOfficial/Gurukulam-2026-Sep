name: Deploy Gurukulam Application

on:
  push:
    branches:
      - main
      - claude/project-analysis-6t08cr

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Deployment & PM2 Restart
        run: |
          set -e
          PROJECT_DIR="/var/www/html/gurukulam/gurukulam-claude/Gurukulam-2026-Sep"
          BACKUP_DIR="/var/www/html/gurukulam/db-bakup"
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          BACKUP_FILE="${BACKUP_DIR}/gurukulamdbbackup_${TIMESTAMP}.sql"
          DB_NAME="gurukulam"
          TARGET_BRANCH="claude/project-analysis-6t08cr"

          echo "1. Starting database backup..."
          sudo mkdir -p "${BACKUP_DIR}"
          sudo -u postgres pg_dump "${DB_NAME}" | sudo tee "${BACKUP_FILE}" > /dev/null

          echo "2. Navigating to project directory..."
          cd "${PROJECT_DIR}"

          echo "4. Fetching and checking out target branch..."
          git fetch origin
          git reset --hard HEAD
          git clean -fd
          git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          git pull origin "${TARGET_BRANCH}"

          echo "6. Installing dependencies..."
          npm install

          echo "8. Building application..."
          npm run build

          echo "9. Restarting PM2 services..."
          sudo pm2 restart gurukulam-api gurukulam-web --update-env
